<style>
:root{--b:#0f6cbd;--g:#1a7f37;--r:#c62828;--bg:#f4f6f9}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#222;-webkit-text-size-adjust:100%}
header{background:var(--b);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:1.1rem;margin:0}.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:.9rem;margin-top:6px}
.bar{height:8px;background:#ffffff55;border-radius:4px;margin-top:8px;overflow:hidden}.bar div{height:100%;background:#ffd54f;width:0;transition:width .3s}
main{max-width:820px;margin:auto;padding:12px}
.card{background:#fff;border:1px solid #d0d7de;border-radius:6px;margin:14px 0;overflow:hidden}
.qh{background:#e7f1fb;padding:8px 12px;font-size:.85rem;display:flex;justify-content:space-between;border-bottom:1px solid #d0d7de}
.qb{padding:12px}.qt{margin:0 0 10px;line-height:1.45}
label.opt{display:flex;gap:8px;padding:10px;border-radius:4px;margin:4px 0;cursor:pointer;border:1px solid transparent;align-items:flex-start}
label.opt:hover{background:#f3f6fa}label.opt input{margin-top:3px;transform:scale(1.2)}
.ok{background:#e6f4ea!important;border-color:var(--g)!important}.ko{background:#fdecea!important;border-color:var(--r)!important}
button{font-size:1rem;padding:10px 16px;border-radius:6px;border:0;background:var(--b);color:#fff;cursor:pointer;margin:4px 4px 4px 0;-webkit-appearance:none}
button.sec{background:#e1e4e8;color:#222}button.on{background:#ffd54f;color:#222}button:disabled{opacity:.5}
.fb{margin-top:10px;padding:10px;border-radius:4px;font-size:.95rem;line-height:1.45;display:none;white-space:pre-line}
.fb.good{display:block;background:#e6f4ea}.fb.bad{display:block;background:#fdecea}
.filters{display:flex;flex-wrap:wrap}.timer{font-weight:bold}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px;text-align:left}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
.cf{position:absolute;font-size:1.6rem;animation:fall 1.4s ease-in forwards}@keyframes fall{to{transform:translateY(100vh) rotate(540deg);opacity:0}}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100dvh;display:flex;flex-direction:column;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-size:20px}
*{touch-action:manipulation}

main>*{max-width:900px;margin-left:auto;margin-right:auto}

{c:1,q:"Une entreprise a un actif total de 250 000 $ et un passif total de 90 000 $. Quel est le montant des capitaux propres ?",o:["340 000 $","90 000 $","160 000 $","250 000 $"],a:2,e:"CP = Actif − Passif = 250 000 − 90 000 = 160 000 $."},
{c:1,q:"Au cours de l’exercice, l’actif augmente de 30 000 $ et le passif diminue de 5 000 $. Comment varient les capitaux propres ?",o:["Hausse de 25 000 $","Hausse de 35 000 $","Baisse de 35 000 $","Hausse de 30 000 $"],a:1,e:"ΔCP = ΔActif − ΔPassif = 30 000 − (−5 000) = +35 000 $."},
{c:1,q:"Le propriétaire paie son loyer personnel avec le compte bancaire de l’entreprise sans l’enregistrer comme retrait. Quel principe est violé ?",o:["Continuité de l’exploitation","Personnalité de l’entité","Coût d’origine","Permanence des méthodes"],a:1,e:"Personnalité de l’entité : les opérations du propriétaire sont distinctes de celles de l’entreprise (ici, ce serait un retrait)."},
{c:1,q:"Un terrain acheté 120 000 $ vaut aujourd’hui 180 000 $ selon un évaluateur. À quel montant figure-t-il au bilan ?",o:["180 000 $","150 000 $","120 000 $","60 000 $"],a:2,e:"Principe du coût d’origine : l’actif est comptabilisé au coût payé, soit 120 000 $."},
{c:1,q:"Selon le principe de réalisation, un produit est constaté lorsque :",o:["l’argent est encaissé","le contrat est signé","il est gagné (bien livré ou service rendu)","la facture est payée par le client"],a:2,e:"Le produit est constaté quand il est gagné, peu importe le moment de l’encaissement."},
{c:1,q:"Une entreprise de services démarre avec un apport de 20 000 $ en argent et un emprunt bancaire de 15 000 $, puis achète du matériel 8 000 $ comptant. Quel est l’actif total ?",o:["35 000 $","43 000 $","27 000 $","20 000 $"],a:0,e:"Caisse 20 000 + 15 000 − 8 000 = 27 000; Matériel 8 000. Actif = 27 000 + 8 000 = 35 000 $ (= Passif 15 000 + CP 20 000)."},
{c:1,q:"Quelle opération n’a AUCUN effet sur le total de l’actif ?",o:["Emprunt bancaire encaissé","Encaissement d’un compte client","Retrait du propriétaire en argent","Achat de fournitures à crédit"],a:1,e:"Encaisser un compte client : Caisse ↑, Clients ↓ du même montant. Total de l’actif inchangé."},
// ---- Ch2
{c:2,q:"Dans le système de la partie double, une augmentation d’un compte de passif s’inscrit :",o:["au débit","au crédit","au débit ou au crédit selon le montant","uniquement dans le journal"],a:1,e:"Actif : augmente au débit. Passif et capitaux propres : augmentent au crédit."},
{c:2,q:"L’entreprise achète du matériel de 6 500 $ à crédit. Quelle est l’écriture ?",o:["Dt Matériel / Ct Caisse","Dt Fournisseurs / Ct Matériel","Dt Matériel / Ct Fournisseurs","Dt Caisse / Ct Fournisseurs"],a:2,e:"Actif Matériel ↑ (débit) et dette Fournisseurs ↑ (crédit) de 6 500 $."},
{c:2,q:"Le compte Caisse a un solde d’ouverture de 12 000 $, des débits de 45 000 $ et des crédits de 38 500 $. Quel est le solde de clôture ?",o:["18 500 $","95 500 $","5 500 $","6 500 $"],a:0,e:"Solde débiteur = 12 000 + 45 000 − 38 500 = 18 500 $."},
{c:2,q:"Quel est l’ordre normal du cycle comptable ?",o:["Grand livre → journal → balance","Journal → grand livre → balance de vérification","Balance → journal → grand livre","Journal → balance → grand livre"],a:1,e:"On journalise, on reporte au grand livre, puis on prépare la balance de vérification."},
{c:2,q:"La balance de vérification est équilibrée. Que peut-on en conclure ?",o:["Il n’y a aucune erreur","Le total des débits égale le total des crédits, mais certaines erreurs peuvent subsister","Les états financiers sont audités","Tous les comptes ont un solde débiteur"],a:1,e:"Une balance équilibrée ne détecte pas, par ex., une écriture omise ou portée au mauvais compte du même côté."},
{c:2,q:"Le propriétaire rembourse 4 000 $ d’un effet à payer en argent. Écriture :",o:["Dt Caisse / Ct Effets à payer","Dt Effets à payer / Ct Caisse","Dt Retraits / Ct Caisse","Dt Effets à payer / Ct Apports"],a:1,e:"Passif ↓ (débit) et actif Caisse ↓ (crédit) de 4 000 $."},
{c:2,q:"Une balance de vérification présente : Caisse 9 000 Dt, Clients 7 000 Dt, Matériel 24 000 Dt, Fournisseurs 5 500 Ct, Effet à payer 12 000 Ct, Capital ? Ct. Quel est le solde du Capital ?",o:["40 000 $","22 500 $","17 500 $","57 500 $"],a:1,e:"Débits = 9 000 + 7 000 + 24 000 = 40 000. Crédits connus = 17 500. Capital = 40 000 − 17 500 = 22 500 $."},
{c:2,q:"Lequel de ces comptes a normalement un solde débiteur ?",o:["Fournisseurs","Capital","Clients","Effets à payer"],a:2,e:"Clients est un actif : solde normal débiteur."},
{c:2,q:"Un encaissement de 3 000 $ d’un client a été inscrit Dt Caisse 3 000 / Ct Ventes 3 000 au lieu de créditer Clients. La balance :",o:["sera déséquilibrée de 3 000 $","sera déséquilibrée de 6 000 $","restera équilibrée","ne pourra pas être préparée"],a:2,e:"Débit et crédit égaux : la balance reste équilibrée malgré l’erreur de compte (Ventes surévaluées, Clients surévalués)."},
// ---- Ch3
{c:3,q:"Quel état financier communique la performance (bénéfice ou perte) d’une entreprise pour une période ?",o:["Le bilan","L’état des résultats","L’état des capitaux propres","La balance de vérification"],a:1,e:"L’état des résultats présente produits, charges, gains et pertes d’une période."},
{c:3,q:"Parmi les états suivants, lequel est établi à une DATE plutôt que pour une période ?",o:["État des résultats","État des flux de trésorerie","Bilan","État des capitaux propres"],a:2,e:"Le bilan est à une date; résultats, capitaux propres et flux de trésorerie couvrent une période."},
{c:3,q:"Quel lien existe entre l’état des résultats et l’état des capitaux propres ?",o:["Le total de l’actif est reporté à l’état des capitaux propres","Le bénéfice net est reporté à l’état des capitaux propres","Les retraits sont présentés à l’état des résultats","Il n’y a aucun lien"],a:1,e:"Le bénéfice net (ou la perte) augmente (diminue) les capitaux propres; le solde de clôture va ensuite au bilan."},
{c:3,q:"Pour une petite entreprise individuelle, quel état financier est souvent jugé facultatif, son information pouvant figurer au bilan ?",o:["L’état des résultats","Le bilan","L’état des capitaux propres","Aucun, tous sont obligatoires"],a:2,e:"L’état des capitaux propres peut être omis : son contenu (apports, bénéfice, retraits) peut être présenté dans la section capitaux propres du bilan."},
{c:3,q:"Lequel des éléments suivants provient de l’exploitation courante (activités principales) ?",o:["Gain sur cession de matériel","Perte due à un incendie","Produits de services rendus","Apport du propriétaire"],a:2,e:"Produits et charges = activités principales. Gains et pertes = opérations accessoires ou exceptionnelles. L’apport n’est pas un résultat."},
{c:3,q:"Données de l’exercice : produits d’exploitation 185 000 $, charges d’exploitation 112 400 $, gain sur cession 6 300 $, perte sur placement 2 900 $. Quel est le bénéfice net ?",o:["72 600 $","76 000 $","81 700 $","69 700 $"],a:1,e:"BN = Produits − Charges + Gains − Pertes\n= 185 000 − 112 400 + 6 300 − 2 900 = 76 000 $."},
{c:3,q:"Produits 96 000 $, charges 104 500 $, gain 3 200 $, perte 1 700 $, retraits du propriétaire 10 000 $. Quel est le résultat net ?",o:["Perte nette de 7 000 $","Perte nette de 17 000 $","Bénéfice net de 7 000 $","Perte nette de 8 500 $"],a:0,e:"96 000 − 104 500 + 3 200 − 1 700 = −7 000 $ (perte nette). Les retraits ne sont PAS une charge."},
{c:3,q:"Données : actif total 310 000 $, passif 140 000 $, ventes 210 000 $, charges 158 000 $, gain 4 000 $, perte 6 000 $. Bénéfice net ?",o:["170 000 $","52 000 $","50 000 $","54 000 $"],a:2,e:"L’actif et le passif ne servent pas au calcul du résultat.\nBN = 210 000 − 158 000 + 4 000 − 6 000 = 50 000 $."},
{c:3,q:"Une société de personnes (A et B) : capitaux d’ouverture 240 000 $, nouveaux apports 35 000 $, bénéfice net 76 000 $, retraits 48 000 $. Capitaux propres de clôture ?",o:["268 000 $","399 000 $","303 000 $","351 000 $"],a:2,e:"Clôture = Ouverture + Apports + BN − Retraits\n= 240 000 + 35 000 + 76 000 − 48 000 = 303 000 $."},
{c:3,q:"Associés X et Y : capital au début 88 000 $, perte nette 14 000 $, apport 20 000 $, retraits 22 000 $. L’actif est de 260 000 $ et le passif de 185 000 $ au début. Capital de clôture ?",o:["72 000 $","100 000 $","116 000 $","75 000 $"],a:0,e:"88 000 + 20 000 − 14 000 − 22 000 = 72 000 $. (Actif/passif = distracteurs.)"},
{c:3,q:"Un retrait du propriétaire de 2 500 $ en argent :",o:["est une charge de l’état des résultats","diminue les capitaux propres sans toucher le résultat","augmente le passif","est un produit négatif"],a:1,e:"Retrait : Dt Retraits / Ct Caisse. Diminue les CP, n’affecte pas le bénéfice."},
{c:3,q:"Capital au début 50 000 $; capital à la fin 68 000 $; apports 10 000 $; retraits 15 000 $. Quel est le bénéfice net ?",o:["18 000 $","23 000 $","13 000 $","43 000 $"],a:1,e:"Fin = Début + Apports + BN − Retraits → 68 000 = 50 000 + 10 000 + BN − 15 000 → BN = 23 000 $."},
{c:3,q:"Un service est rendu en mars mais sera encaissé en mai. Quand le produit est-il constaté ?",o:["En mai","En mars","Moitié-moitié","À la fin de l’exercice seulement"],a:1,e:"Réalisation : le produit est gagné en mars (Dt Clients / Ct Produits)."},
// ---- Ch4
{c:4,q:"Un bien est vendu 2 400 $ avant taxes au Québec. Quel est le total facturé ?",o:["2 640,00 $","2 759,40 $","2 771,40 $","2 639,40 $"],a:1,e:"TPS = 2 400 × 5 % = 120,00\nTVQ = 2 400 × 9,975 % = 239,40\nTotal = 2 400 + 120 + 239,40 = 2 759,40 $."},
{c:4,q:"Sur quelle base la TVQ est-elle calculée depuis 2013 ?",o:["Sur le prix incluant la TPS","Sur le prix avant taxes","Sur la TPS seulement","Sur le prix incluant la TVQ"],a:1,e:"Depuis 2013, la TVQ (9,975 %) se calcule sur le prix avant TPS : plus de « taxe sur taxe »."},
{c:4,q:"TPS perçue sur les ventes du trimestre : 8 450 $; TPS payée sur les achats (CTI) : 3 120 $. Quelle est la remise ?",o:["11 570 $ à payer","5 330 $ à payer","5 330 $ à recevoir","3 120 $ à payer"],a:1,e:"Remise = TPS perçue − CTI = 8 450 − 3 120 = 5 330 $ à verser."},
{c:4,q:"Ventes taxables du trimestre 100 000 $ et achats taxables 42 000 $. Quelle est la TVQ nette à remettre ?",o:["5 785,50 $","9 975,00 $","4 189,50 $","5 800,00 $"],a:0,e:"TVQ perçue = 100 000 × 9,975 % = 9 975,00\nRTI = 42 000 × 9,975 % = 4 189,50\nRemise = 9 975,00 − 4 189,50 = 5 785,50 $."},
{c:4,q:"Un client paie 1 149,75 $ taxes incluses. Quel est le prix avant taxes ?",o:["1 000,00 $","1 034,78 $","977,29 $","1 005,00 $"],a:0,e:"Facteur = 1 + 0,05 + 0,09975 = 1,14975\n1 149,75 ÷ 1,14975 = 1 000,00 $."},
{c:4,q:"Pour une entreprise inscrite, la TPS payée sur un achat de fournitures est comptabilisée :",o:["en charge Fournitures","au débit du compte TPS à recevoir / CTI","au crédit de TPS à payer","comme produit"],a:1,e:"La TPS récupérable (CTI) est une créance envers l’État : Dt TPS à recevoir (ou diminution de TPS à payer)."},
{c:4,q:"Une vente de services de 800 $ + taxes, à crédit. Quel montant est crédité au compte TVQ à payer ?",o:["40,00 $","79,80 $","119,80 $","83,79 $"],a:1,e:"TVQ = 800 × 9,975 % = 79,80 $. Écriture : Dt Clients 919,80 / Ct Produits 800 / Ct TPS 40 / Ct TVQ 79,80."},
{c:4,q:"Si les CTI d’une période dépassent la TPS perçue, l’entreprise :",o:["doit quand même verser la TPS perçue","a droit à un remboursement","paie une pénalité","ne fait aucune déclaration"],a:1,e:"TPS perçue − CTI < 0 → remboursement de l’État."},
// ---- Ch5
{c:5,q:"Vente de 5 000 $ à crédit, conditions 2/10, n/30. Le client paie dans le délai d’escompte. Montant encaissé ?",o:["5 000 $","4 900 $","4 500 $","4 990 $"],a:1,e:"Escompte = 5 000 × 2 % = 100. Encaissement = 4 900 $."},
{c:5,q:"Vente de 5 000 $ (2/10, n/30). Le client retourne 800 $ de marchandises, puis paie dans le délai. Montant encaissé ?",o:["4 200 $","4 116 $","4 100 $","4 900 $"],a:1,e:"Solde = 5 000 − 800 = 4 200. Escompte = 4 200 × 2 % = 84. Encaissé = 4 116 $."},
{c:5,q:"Méthode périodique — Stock début 18 000 $, achats 64 000 $, rendus et rabais sur achats 3 000 $, escomptes sur achats 1 200 $, transport sur achats 2 200 $, stock fin 21 000 $. Coût des marchandises vendues ?",o:["59 000 $","63 400 $","80 000 $","61 400 $"],a:0,e:"Achats nets = 64 000 − 3 000 − 1 200 + 2 200 = 62 000\nMarch. disponibles = 18 000 + 62 000 = 80 000\nCMV = 80 000 − 21 000 = 59 000 $."},
{c:5,q:"Ventes 150 000 $, rendus et rabais sur ventes 4 000 $, escomptes sur ventes 2 500 $. Ventes nettes ?",o:["156 500 $","143 500 $","146 000 $","147 500 $"],a:1,e:"150 000 − 4 000 − 2 500 = 143 500 $."},
{c:5,q:"Ventes nettes 120 000 $, CMV 59 000 $, charges d’exploitation 38 000 $. Marge bénéficiaire brute ?",o:["23 000 $","61 000 $","82 000 $","179 000 $"],a:1,e:"Marge brute = Ventes nettes − CMV = 120 000 − 59 000 = 61 000 $ (les charges d’exploitation viennent après)."},
{c:5,q:"Selon la méthode de l’inventaire permanent, lors d’une vente on enregistre :",o:["seulement Dt Clients / Ct Ventes","Dt Clients / Ct Ventes et Dt CMV / Ct Stock","Dt Achats / Ct Stock","seulement Dt CMV / Ct Stock"],a:1,e:"Inventaire permanent : deux écritures — le prix de vente et le coût (CMV ↑, Stock ↓)."},
{c:5,q:"Selon la méthode de l’inventaire périodique, un achat de marchandises à crédit est porté au débit de :",o:["Stock de marchandises","Achats","CMV","Fournisseurs"],a:1,e:"Périodique : Dt Achats / Ct Fournisseurs; le stock n’est ajusté qu’en fin de période par dénombrement."},
{c:5,q:"Achat de 10 000 $ (1/15, n/45), payé au 12e jour, inventaire permanent. Écriture de paiement ?",o:["Dt Fournisseurs 10 000 / Ct Caisse 10 000","Dt Fournisseurs 10 000 / Ct Caisse 9 900 / Ct Stock 100","Dt Fournisseurs 9 900 / Ct Caisse 9 900","Dt Stock 100 / Ct Caisse 100"],a:1,e:"Escompte = 1 % × 10 000 = 100, réduit le coût du stock en inventaire permanent. Caisse = 9 900 $."},
{c:5,q:"Un rabais sur achat de 600 $ obtenu d’un fournisseur (inventaire permanent, achat à crédit) :",o:["Dt Stock / Ct Fournisseurs","Dt Fournisseurs / Ct Stock","Dt Fournisseurs / Ct Ventes","Dt CMV / Ct Fournisseurs"],a:1,e:"La dette diminue (Dt Fournisseurs) et le coût du stock diminue (Ct Stock)."},
// ---- Ch12
{c:12,q:"L’achat d’un camion de livraison payé comptant est classé dans les activités :",o:["d’exploitation","d’investissement","de financement","hors trésorerie"],a:1,e:"Acquisition d’immobilisations = activité d’investissement."},
{c:12,q:"Le remboursement du capital d’un emprunt bancaire est classé dans les activités :",o:["d’exploitation","d’investissement","de financement","aucune"],a:2,e:"Emprunts, remboursements, apports et retraits du propriétaire = financement."},
{c:12,q:"L’encaissement des comptes clients et le paiement des salaires relèvent des activités :",o:["d’exploitation","d’investissement","de financement","de capitalisation"],a:0,e:"Opérations liées aux activités principales = exploitation."},
{c:12,q:"Flux d’exploitation +42 000 $, d’investissement −65 000 $, de financement +30 000 $; trésorerie au début 15 000 $. Trésorerie à la fin ?",o:["7 000 $","22 000 $","−8 000 $","152 000 $"],a:1,e:"Variation = 42 000 − 65 000 + 30 000 = +7 000\nFin = 15 000 + 7 000 = 22 000 $."},
{c:12,q:"Méthode indirecte : bénéfice net 50 000 $, amortissement 8 000 $, augmentation des clients 6 000 $, augmentation des fournisseurs 3 000 $. Flux d’exploitation ?",o:["55 000 $","67 000 $","45 000 $","49 000 $"],a:0,e:"50 000 + 8 000 (non monétaire) − 6 000 (clients ↑) + 3 000 (fournisseurs ↑) = 55 000 $."},
{c:12,q:"Les retraits du propriétaire en argent apparaissent à l’état des flux de trésorerie dans :",o:["l’exploitation, comme charge","l’investissement","le financement, comme sortie","ils n’y figurent pas"],a:2,e:"Retraits = sortie liée au financement par le propriétaire."},
{c:12,q:"La vente d’un équipement usagé encaissée 12 000 $ est présentée :",o:["en exploitation (+12 000 $)","en investissement (+12 000 $)","en financement (+12 000 $)","seulement à l’état des résultats"],a:1,e:"Cession d’immobilisation = entrée d’investissement. (Le gain éventuel est retiré du bénéfice en exploitation, méthode indirecte.)"}
];
const L="abcd";let mode="P",chf="all",list=[],score=0,done=0,streak=0,timer=null,tleft=0,res={};
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function filters(){const f=$("flt");f.innerHTML="";[["all","Tous ("+Q.length+")"]].concat(Object.keys(CH).map(k=>[k,CH[k]+" ("+Q.filter(q=>q.c==k).length+")"])).forEach(([k,t])=>{const b=document.createElement("button");b.textContent=t;b.className=chf==k?"on":"sec";b.disabled=mode=="E";b.onclick=()=>{chf=k;start()};f.appendChild(b)})}
function start(){clearInterval(timer);$("tm").textContent="";score=done=streak=0;res={};$("end").innerHTML="";
 let pool=Q.map((q,i)=>Object.assign({id:i},q));if(mode=="P"&&chf!="all")pool=pool.filter(q=>q.c==chf);
 pool=shuffle(pool);if(mode=="E")pool=pool.slice(0,20);
 list=pool.map(q=>{const idx=shuffle([0,1,2,3]);return Object.assign({},q,{o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a),ans:null})});
 $("md").textContent=mode=="E"?"Mode examen":"Mode pratique";filters();render();upd();
 if(mode=="E"){tleft=30*60;tick();timer=setInterval(tick,1000)}window.scrollTo(0,0)}
function tick(){tleft--;const m=Math.floor(tleft/60),s=tleft%60;$("tm").textContent="⏱ "+m+":"+String(s).padStart(2,"0");if(tleft<=0)finish()}
function render(){const c=$("qs");c.innerHTML="";list.forEach((q,n)=>{const d=document.createElement("div");d.className="card";
 d.innerHTML=`<div class="qh"><span><b>Question ${n+1}</b> · ${CH[q.c]}</span><span>Noté sur 1,00</span></div><div class="qb"><p class="qt">${q.q}</p>`+
 q.o.map((o,i)=>`<label class="opt" id="l${n}_${i}"><input type="radio" name="q${n}" value="${i}"> <span>${L[i]}. ${o}</span></label>`).join("")+
 `<button id="v${n}">${mode=="E"?"Enregistrer":"Vérifier"}</button><div class="fb" id="f${n}"></div></div>`;c.appendChild(d);
 d.querySelector("#v"+n).onclick=()=>check(n)});
 if(mode=="E"){const b=document.createElement("button");b.textContent="Terminer l’examen";b.onclick=finish;c.appendChild(b)}}
function check(n){const q=list[n],sel=document.querySelector(`input[name=q${n}]:checked`);if(!sel){alert("Choisissez une réponse.");return}
 if(q.ans!==null&&mode=="P")return;const first=q.ans===null;q.ans=+sel.value;
 if(mode=="E"){if(first)done++;$("v"+n).textContent="Enregistrée ✔";upd();return}
 done++;$("v"+n).disabled=true;document.querySelectorAll(`input[name=q${n}]`).forEach(i=>i.disabled=true);
 const ok=q.ans==q.a;tally(q,ok);$("l"+n+"_"+q.a).classList.add("ok");if(!ok)$("l"+n+"_"+q.ans).classList.add("ko");
 const f=$("f"+n);f.className="fb "+(ok?"good":"bad");f.textContent=(ok?"✅ Bonne réponse ! ":"❌ Incorrect. Bonne réponse : "+L[q.a]+". ")+"\n"+q.e;
 if(ok){streak++;confetti(streak>=3)}else streak=0;upd();if(done==list.length)setTimeout(finish,600)}
function tally(q,ok){res[q.c]=res[q.c]||[0,0];res[q.c][1]++;if(ok){res[q.c][0]++;score++}}
function upd(){$("sc").textContent=score;$("tt").textContent=mode=="E"?list.length:done;$("st").textContent=streak;$("pb").style.width=(list.length?100*done/list.length:0)+"%"}
function confetti(big){const e=["🎉","⭐","✨","💰","🧾","👏"],c=$("confetti");for(let i=0;i<(big?24:10);i++){const s=document.createElement("span");s.className="cf";s.textContent=e[i%e.length];s.style.left=Math.random()*100+"vw";s.style.top="-30px";s.style.animationDelay=Math.random()*.4+"s";c.appendChild(s);setTimeout(()=>s.remove(),2000)}}
function finish(){clearInterval(timer);if(mode=="E"){score=0;res={};list.forEach((q,n)=>{const ok=q.ans===q.a;tally(q,ok);
 document.querySelectorAll(`input[name=q${n}]`).forEach(i=>i.disabled=true);$("v"+n).disabled=true;$("l"+n+"_"+q.a).classList.add("ok");
 if(q.ans!==null&&!ok)$("l"+n+"_"+q.ans).classList.add("ko");const f=$("f"+n);f.className="fb "+(ok?"good":"bad");
 f.textContent=(ok?"✅ ":"❌ "+(q.ans===null?"Sans réponse. ":"")+"Bonne réponse : "+L[q.a]+". ")+"\n"+q.e})}
 const tot=list.length,pct=Math.round(100*score/tot);let rows=Object.keys(res).map(k=>`<tr><td>${CH[k]}</td><td>${res[k][0]} / ${res[k][1]}</td><td>${Math.round(100*res[k][0]/res[k][1])} %</td></tr>`).join("");
 $("end").innerHTML=`<div class="card"><div class="qh"><b>Résultats</b><span>${pct>=80?"🏆":pct>=60?"👍":"📚"}</span></div><div class="qb"><p style="font-size:1.3rem">Note : <b>${score.toFixed(2).replace(".",",")} / ${tot},00</b> (${pct} %)</p><table><tr><th>Chapitre</th><th>Score</th><th>%</th></tr>${rows}</table><p><button id="rs">🔄 Recommencer</button></p></div></div>`;

<script>

function qStatus(id){var h=HIST[id];if(!h||!h.n)return 0;if(h.res===false)return 1;if(h.ok/h.n<.5)return 2;return 3}
function isWeak(id){var h=HIST[id];return !!h&&h.n>0&&(h.res===false||h.ok/h.n<.5)}
function computeMastery(){var m={};Object.keys(CH).forEach(function(c){var qs=Q.map(function(q,i){return i}).filter(function(i){return Q[i].c==c}),a=0,o=0,ms=0;
 qs.forEach(function(i){var h=HIST[i];if(h){a+=h.n;o+=h.ok;if(h.res)ms++}});m[c]={q:qs.length,att:a,ok:o,rate:a?Math.round(100*o/a):null,mastery:Math.round(100*ms/qs.length)}});return m}
function recordAnswer(q,ok){var h=HIST[q.id]||{n:0,ok:0};h.n++;if(ok)h.ok++;h.last=q.ans===null?null:L[Q[q.id].o.indexOf(q.o[q.ans])];h.res=!!ok;h.t=Date.now();HIST[q.id]=h;
 lsSet("hist",HIST);var s=lsGet("stats",{answered:0,correct:0});s.answered++;if(ok)s.correct++;s.updated=Date.now();lsSet("stats",s);lsSet("mastery",computeMastery())}
function badge(id){var h=HIST[id];if(!h||!h.n)return'<span class="bdg nw">Nouvelle</span>';
 return h.res?'<span class="bdg okb">✅ réussie '+h.ok+'/'+h.n+'</span>':'<span class="bdg kob">❌ ratée la dernière fois</span>'}
/* ===== Session en cours ===== */
var examEnd=0,resuming=lsGet("session",null);

  list:list.map(function(q){return{id:q.id,p:q.o.map(function(o){return Q[q.id].o.indexOf(o)}),ans:q.ans}})})}

 $("l"+n+"_"+q.a).classList.add("ok");if(!ok)$("l"+n+"_"+q.ans).classList.add("ko");var f=$("f"+n);f.className="fb "+(ok?"good":"bad");
 f.textContent=(ok?"✅ Bonne réponse ! ":"❌ Incorrect. Bonne réponse : "+L[q.a]+". ")+"\n"+q.e})}
(function(){
var s0=start;
start=function(){var S=resuming;resuming=null;
 if(S&&S.list&&S.list.length){try{
  clearInterval(timer);$("end").innerHTML="";mode=S.mode;chf=S.chf;score=S.score;done=S.done;streak=S.streak;res=S.res||{};examEnd=S.examEnd||0;
  list=S.list.map(function(x){var q=Q[x.id];return Object.assign({id:x.id},q,{o:x.p.map(function(i){return q.o[i]}),a:x.p.indexOf(q.a),ans:x.ans})});
  setModeBtns();$("md").textContent=modeLabel();$("tm").textContent="";filters();render();restoreUI();upd();
  if(mode=="E"){tleft=Math.max(1,Math.round((examEnd-Date.now())/1000)+1);tick();if(tleft>0)timer=setInterval(tick,1000)}
  setTimeout(function(){if(window.goQ&&!document.body.classList.contains("done"))goQ(S.cur||0);saveSession()},0);return}catch(e){lsDel("session")}}
 if(mode=="R"){var ids=Q.map(function(q,i){return i}).filter(function(i){return isWeak(i)&&(chf=="all"||Q[i].c==chf)});
  if(!ids.length){alert(chf=="all"?"Aucune erreur à revoir 🎉":"Aucune erreur à revoir dans ce chapitre 🎉");mode="P";setModeBtns()}}
 s0();$("md").textContent=modeLabel();
 if(mode!="E"){var p=list.slice(),ord=shuffle(p.map(function(_,i){return i}));var rk={};ord.forEach(function(v,i){rk[v]=i});
  if(mode=="R")p=p.filter(function(q){return isWeak(q.id)});
  p=p.map(function(q,i){return{q:q,k:[qStatus(q.id)==0?0:qStatus(q.id)==1?1:qStatus(q.id)==2?2:3,rk[i]]}}).sort(function(x,y){return x.k[0]-y.k[0]||x.k[1]-y.k[1]}).map(function(x){return x.q});
  list=p;render();upd()}
 setModeBtns();examEnd=mode=="E"?Date.now()+30*60*1000:0;saveSession()};

 if(mode!="E"&&done>d0)recordAnswer(q,q.ans==q.a);saveSession()};

finish=function(){var wasE=mode=="E";f0();
 if(wasE){list.forEach(function(q){if(q.ans!==null)recordAnswer(q,q.ans===q.a)});var per={};Object.keys(res).forEach(function(k){per[k]={ok:res[k][0],n:res[k][1]}});
  var ex=lsGet("exams",[]);ex.push({date:new Date().toISOString(),score:score,total:list.length,pct:Math.round(100*score/list.length),perChapter:per});lsSet("exams",ex.slice(-50))}
 lsDel("session");HIST=lsGet("hist",HIST)};
})();
/* ===== Écran « Mes statistiques » ===== */
function fmtDate(d){try{return new Date(d).toLocaleString("fr-CA",{dateStyle:"medium",timeStyle:"short"})}catch(e){return String(d)}}
function showStats(){var s=lsGet("stats",{answered:0,correct:0}),m=computeMastery(),ex=lsGet("exams",[]),seen=Object.keys(HIST).length,weak=Q.filter(function(_,i){return isWeak(i)}).length;
 var rows=Object.keys(CH).map(function(c){var x=m[c];return'<tr><td>'+CH[c]+'</td><td>'+(x.rate==null?"–":x.rate+" %")+'</td><td>'+x.mastery+' %</td><td>'+x.att+'</td></tr>'}).join("");
 var er=ex.slice().reverse().slice(0,10).map(function(e){return'<tr><td>'+fmtDate(e.date)+'</td><td>'+e.score+' / '+e.total+' ('+e.pct+' %)</td><td>'+Object.keys(e.perChapter).map(function(k){var p=e.perChapter[k];return"Ch. "+k+" : "+p.ok+"/"+p.n}).join(" · ")+'</td></tr>'}).join("");
 var o=$("statsOv");o.innerHTML='<div class="card"><div class="qh"><b>📊 Mes statistiques</b><button id="stX" class="sec">✕ Fermer</button></div><div class="qb">'+
 '<p>Questions répondues : <b>'+s.answered+'</b><br>Taux de réussite : <b>'+(s.answered?Math.round(100*s.correct/s.answered)+" %":"–")+'</b><br>Questions vues : <b>'+seen+' / '+Q.length+'</b> · À revoir : <b>'+weak+'</b></p>'+
 '<h3>Par chapitre</h3><table><tr><th>Chapitre</th><th>Réussite</th><th>Maîtrise*</th><th>Essais</th></tr>'+rows+'</table><p style="font-size:.85em">* Maîtrise = part des questions du chapitre réussies à la dernière tentative.</p>'+
 '<h3>Derniers examens</h3>'+(er?'<table><tr><th>Date</th><th>Note</th><th>Par chapitre</th></tr>'+er+'</table>':'<p>Aucun examen terminé pour l’instant.</p>')+
 '<p><button id="stR" class="sec">🗑️ Réinitialiser ma progression</button></p></div></div>';o.hidden=false;
 $("stX").onclick=function(){o.hidden=true};$("stR").onclick=resetProgress}

 lsClearAll();HIST={};$("statsOv").hidden=true;mode="P";chf="all";setModeBtns();start()}
(function(){var css=document.createElement("style");css.textContent=
 ".bdg{display:inline-block;font-size:.8em;font-weight:normal;padding:2px 8px;border-radius:10px;margin-left:6px;white-space:nowrap}.bdg.nw{background:#e7f1fb;color:#0f6cbd}.bdg.okb{background:#e6f4ea;color:#1a7f37}.bdg.kob{background:#fdecea;color:#b42318}"+
